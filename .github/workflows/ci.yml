name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # CI=true makes react-scripts treat warnings as errors, so an unused
      # import or a bad hook dependency fails the build instead of sliding by.
      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Report bundle size
        run: |
          echo "### Bundle size" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h build/static/js/*.js build/static/css/*.css | sort -h >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
